# Стек Mini App: база, бот вместе с приложением и туннель до публичного
# HTTPS-адреса (без него Telegram не откроет Mini App).
#
# Какой туннель поднимать, выбирает COMPOSE_PROFILES в .env:
#   cf  — Cloudflare Tunnel: постоянный адрес на своём домене. Адрес лежит в
#         WEBAPP_URL, ingress — в cloudflared/config.yml, ключ — в secrets/cloudflared/
#   lhr — localhost.run: ни домена, ни аккаунта. Адрес выдаётся при подключении,
#         контейнер публикует его на общий том, бот читает оттуда
# Дальше всё одной командой:  docker compose up -d --build
#
# Провайдер режет DNS-записи Cloudflare (cloudflared в логах не находит edge)?
# К профилю cf добавляется DoH-резолвер из docker-compose.doh.yml — см. там.
services:
  db:
    image: postgres:18
    container_name: schedule-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: schedule
      POSTGRES_PASSWORD: schedule
      POSTGRES_DB: schedule
      # чтобы psql внутри контейнера не ломал кириллицу в выводе
      LANG: C.UTF-8
    ports:
      # наружу для host-скриптов (scripts/parse_preview.py, psql с хоста).
      # 5433, потому что 5432 обычно занят локальным PostgreSQL; внутри сети
      # compose база всё равно db:5432
      - "5433:5432"
    volumes:
      # в postgres 18+ монтируем каталог целиком, данные лягут в /var/lib/postgresql/18/docker
      - vstu-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schedule -d schedule"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Бот + Mini App: webapp/ отдаётся тем же процессом, отдельный контейнер не нужен.
  bot:
    build: .
    container_name: schedule-bot
    restart: unless-stopped
    env_file: .env
    environment:
      # внутри сети compose база зовётся db:5432 — перекрываем localhost:5433 из .env
      DATABASE_URL: postgresql+asyncpg://schedule:schedule@db:5432/schedule
      WEBAPP_HOST: 0.0.0.0
      WEBAPP_PORT: "7070"
    ports:
      # наружу — чтобы приложение можно было открыть с хоста в браузере
      # (для этого в .env нужен WEBAPP_ALLOW_INSECURE=1, и ТОЛЬКО при
      #  остановленном туннеле: иначе API без проверки подписи Telegram
      #  окажется доступен всем по публичному адресу)
      - "7070:7070"
    volumes:
      # сюда туннель localhost.run кладёт актуальный адрес; бот только читает
      - tunnel-state:/state:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7070/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Профиль lhr. localhost.run — SSH-реверс: ни аккаунта, ни установки.
  # Адрес меняется при каждом переподключении, поэтому scripts/tunnel.sh пишет
  # его в общий том /state/url, а бот читает оттуда на каждое построение кнопки
  # (пока WEBAPP_URL пуст). Посмотреть текущий:
  #   docker compose logs tunnel | findstr lhr.life
  # Постоянный поддомен даёт регистрация ключа на https://admin.localhost.run/
  tunnel:
    image: alpine:latest
    container_name: schedule-tunnel
    restart: unless-stopped
    profiles: ["lhr"]
    # tr -d '\r': скрипт приходит бинд-монтом с Windows, и после копирования
    # папки или checkout с autocrlf в нём CRLF — sh спотыкается уже на set -u
    command: ["sh", "-c", "tr -d '\\r' </tunnel.sh >/tmp/tunnel.sh && sh /tmp/tunnel.sh"]
    volumes:
      - ./scripts/tunnel.sh:/tunnel.sh:ro
      # приватный ключ, зарегистрированный на admin.localhost.run: с ним
      # поддомен постоянный. Файла нет — туннель поднимается анонимно
      - ./secrets/lhr_ed25519:/key:ro
      - tunnel-state:/state
    depends_on:
      bot:
        condition: service_healthy

  # Профиль cf. Cloudflare Tunnel: постоянный адрес на своём домене без белого IP.
  # cloudflared держит исходящее соединение до края Cloudflare, входящий 443 и
  # сертификат остаются на стороне Cloudflare — поэтому nginx не нужен, а до
  # bot:7070 идёт обычный http внутри сети compose.
  #
  # Нужны два файла: cloudflared/config.yml (id туннеля и ingress, в репозитории)
  # и secrets/cloudflared/<id>.json (ключ туннеля, в .gitignore) — как их
  # получить, см. README_BOT.md. Протокол http2, не QUIC: UDP/7844 провайдеры
  # режут чаще, TCP/7844 до edge обычно открыт.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: schedule-cloudflared
    restart: unless-stopped
    profiles: ["cf"]
    command: --no-autoupdate --config /etc/cloudflared/config.yml tunnel run
    volumes:
      # ingress-правила: в репозитории, секретов не содержат
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      # учётные данные туннеля: только чтение, каталог в .gitignore
      - ./secrets/cloudflared:/home/nonroot/.cloudflared:ro
    depends_on:
      bot:
        condition: service_healthy

volumes:
  # имя тома не трогаю: в нём лежит уже загруженное расписание,
  # переименование создало бы пустой том
  vstu-pgdata:
  # текущий адрес localhost.run — общий между туннелем и ботом
  tunnel-state:
