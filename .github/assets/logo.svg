<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Расписание ВолгГТУ">
  <!-- Значок проекта: листок календаря с точками пар в цветах приложения
       (лекция — зелёный, практика — охра, лаба — красный). -->
  <rect width="128" height="128" rx="30" fill="#3d6b57"/>

  <!-- листок -->
  <rect x="22" y="30" width="84" height="76" rx="14" fill="#fffefb"/>
  <path d="M36 30h56a14 14 0 0 1 14 14v6H22v-6a14 14 0 0 1 14-14z" fill="#17161a"/>
  <rect x="40" y="20" width="9" height="20" rx="4.5" fill="#fffefb"/>
  <rect x="79" y="20" width="9" height="20" rx="4.5" fill="#fffefb"/>

  <!-- дни: занятые залиты, сегодняшний обведён -->
  <rect x="31" y="58" width="19" height="18" rx="5" fill="#e7f1eb"/>
  <rect x="54.5" y="58" width="19" height="18" rx="5" fill="#e7f1eb"/>
  <rect x="78" y="58" width="19" height="18" rx="5" fill="#f1efea"/>
  <rect x="31" y="80" width="19" height="18" rx="5" fill="#e7f1eb"/>
  <rect x="54.5" y="80" width="19" height="18" rx="5" fill="#e7f1eb"/>
  <rect x="79" y="81" width="17" height="16" rx="4.5" fill="#e7f1eb" stroke="#3d6b57" stroke-width="2.5"/>

  <!-- точки пар -->
  <circle cx="37" cy="70" r="2.4" fill="#4a8565"/>
  <circle cx="44" cy="70" r="2.4" fill="#9a6b38"/>
  <circle cx="64" cy="70" r="2.4" fill="#4a8565"/>
  <circle cx="40.5" cy="92" r="2.4" fill="#9a6b38"/>
  <circle cx="60.5" cy="92" r="2.4" fill="#a8574f"/>
  <circle cx="67.5" cy="92" r="2.4" fill="#4a8565"/>
  <circle cx="84" cy="92" r="2.4" fill="#9a6b38"/>
  <circle cx="91" cy="92" r="2.4" fill="#4a8565"/>
</svg>
